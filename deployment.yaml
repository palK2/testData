apiVersion: apps/v1
kind: Deployment
metadata:
  name: testdata-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: testdata
  template:
    metadata:
      labels:
        app: testdata
    spec:
      containers:
      - name: testdata
        image: pallabtestdocker/testdata:latest
        ports:
        - containerPort: 80
